[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "liveasset"
version = "0.1.0"
description = "LiveAsset contextual intent assets: learning, matching and delivery checks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["liveasset"]
